baseURL = "https://ekmungai.github.io/ifrs-docs/"
languageCode = "en-us"
title = "Eloquent IFRS"
themesDir = "themes"
theme = "hugo-whisper-theme"

pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true

# Controls how many words are printed in the content summary on the docs homepage.
# See https://gohugo.io/content-management/summaries/
summaryLength = 30

[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "v7 Docs"
    url = "/v7docs/"
    weight = 2

[[menu.main]]
    name = "v5 Docs"
    url = "/v5docs/"
    weight = 3

[[menu.main]]
    name = "v4 Docs"
    url = "/v4docs/"
    weight = 4

[[menu.main]]
    name = "v3 Docs"
    url = "/v3docs/"
    weight = 5

[[menu.main]]
    name = "v2 Docs"
    url = "/v2docs/"
    weight = 6

[params]
  google_analytics_id=""
  homepage_button_link = '/ifrs-docs/v7docs'
  homepage_button_text = 'Read The Docs'
  homepage_intro = 'Eloquent IFRS is a Package designed to add full Accounting capability to any Laravel application.'
  homepage_image = ''

  ## You can enable to add anchor links to header elements
  # enable_anchor_link = true

  [params.homepage_meta_tags]
    meta_description = "Hugo Whisper is a documentation theme built with Hugo."
    meta_og_title = "Hugo Whisper Theme"
    meta_og_type = "website"
    meta_og_url = "https://hugo-whisper.netlify.com"
    meta_og_image = "https://raw.githubusercontent.com/JugglerX/hugo-whisper-theme/master/images/tn.png"
    meta_og_description = "Hugo Whisper is a documentation theme built with Hugo."
    meta_twitter_card = "summary"
    meta_twitter_site = "@zerostaticio"
    meta_twitter_creator = "@zerostaticio"

  [params.logo]
      mobile = "images/ifrs-logo.png"
      standard  = "images/ifrs-logo.png"
